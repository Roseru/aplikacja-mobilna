name: Project CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.9.5'
      - run: uv sync --project tools/contracts --locked
      - run: python backend/sync_catalog_schemas.py --check
      - run: uv run --project tools/contracts --locked --offline python tools/contracts/validate.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.9.5'
      - run: uv sync --project backend --locked
      - run: uv run --project backend --locked ruff check --config backend/pyproject.toml backend tools/offline_catalog tools/android_ci.py tools/tests/test_android_ci.py
      - run: uv run --project backend --locked ruff format --check --config backend/pyproject.toml backend tools/offline_catalog tools/android_ci.py tools/tests/test_android_ci.py
      - run: uv run --project backend --locked python -m pytest backend/tests/unit
      - run: uv build backend
      - name: Verify the installed wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/e2-wheel" --python 3.13
          uv export --project backend --locked --no-dev --no-emit-project --no-hashes \
            --format requirements-txt --output-file "$RUNNER_TEMP/e2-lock.txt" > /dev/null
          uv pip install --python "$RUNNER_TEMP/e2-wheel/bin/python" \
            --constraint "$RUNNER_TEMP/e2-lock.txt" backend/dist/*.whl
          seed="$GITHUB_WORKSPACE/backend/data/demo/seed.json"
          cd "$RUNNER_TEMP"
          e2-wheel/bin/python -I -m calorie_app.modules.catalog.cli validate --input "$seed"
          e2-wheel/bin/python -I -m calorie_app.modules.catalog.offline_import \
            --database e2-wheel.sqlite \
            --manifest "$GITHUB_WORKSPACE/backend/data/demo/export/manifest.json" \
            --package "$GITHUB_WORKSPACE/backend/data/demo/export/base-pl.1.json.gz" \
            --expected-package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --expected-kind demo
      - run: docker build --build-arg PYTHON_IMAGE=public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f -t calorie-backend:test backend
      - name: Smoke test built API image
        run: |
          docker run -d --name e1-backend-test -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://unused@127.0.0.1:1/unused calorie-backend:test
          trap 'docker logs e1-backend-test; docker rm -f e1-backend-test' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 \
            -f http://127.0.0.1:8000/health/live
          test "$(curl -s -o /tmp/e1-health.json -w '%{http_code}' http://127.0.0.1:8000/health/ready)" = 503
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/calorie_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.9.5'
      - run: uv sync --project backend --locked
      - name: Provision separate databases and runtime roles
        env:
          POSTGRES_USER: postgres
          PGHOST: 127.0.0.1
          PGPASSWORD: ci-test-only
          APP_MIGRATOR_PASSWORD: ci-migrator-only
          APP_API_PASSWORD: ci-api-only
          APP_WORKER_PASSWORD: ci-worker-only
          KEYCLOAK_DB_PASSWORD: ci-keycloak-only
        run: bash infra/local/init-db.sh
      - run: uv run --project backend --locked python -m pytest backend/tests/integration
      - run: docker build --build-arg PYTHON_IMAGE=public.ecr.aws/docker/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f -t calorie-backend:e2 backend
      - name: Real PostgreSQL export and offline import in the built image
        run: |
          storage="$RUNNER_TEMP/e2-artifacts"
          mkdir -p "$storage"
          chmod 777 "$storage"
          image=(docker run --rm --network host -v "$storage:/artifacts"
            -e DATABASE_URL=postgresql+psycopg://calorie_app_migrator:ci-migrator-only@127.0.0.1:5432/calorie_app
            -e CATALOG_ARTIFACT_ROOT=/artifacts/storage calorie-backend:e2)
          "${image[@]}" .venv/bin/alembic upgrade head
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli import \
            --input data/demo/seed.json > "$storage/import-first.json"
          jq -e '.created == true' "$storage/import-first.json"
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli import \
            --input data/demo/seed.json > "$storage/import-repeat.json"
          jq -e '.created == false' "$storage/import-repeat.json"
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli export \
            --package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --release 1 --output /artifacts/export
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli export \
            --package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --release 1 --output /artifacts/repeat
          cmp "$storage/export/base-pl.1.json.gz" "$storage/repeat/base-pl.1.json.gz"
          cmp "$storage/export/manifest.json" "$storage/repeat/manifest.json"
          cmp "$storage/export/base-pl.1.json.gz" backend/data/demo/export/base-pl.1.json.gz
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli publish \
            --package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --release 1
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.offline_import \
            --database /artifacts/catalog.sqlite --manifest /artifacts/export/manifest.json \
            --package /artifacts/export/base-pl.1.json.gz \
            --expected-package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --expected-kind demo
          "${image[@]}" .venv/bin/python -c 'from calorie_app.modules.catalog.offline_import import OfflineCatalog; p=OfflineCatalog("/artifacts/catalog.sqlite", "47bdff67-e58b-5437-919b-ec00159afbc5", "demo").read_active_package(); assert p["counts"] == {"products":18,"rations":1,"components":18,"sources":1}; assert p["rations"][0]["complete"] is False'
          jq '.release = 2 | .published_at = "2026-10-09T12:00:00.1Z"' \
            backend/data/demo/seed.json > "$storage/fractional-input.json"
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli import \
            --input /artifacts/fractional-input.json > "$storage/fractional-first.json"
          jq -e '.created == true' "$storage/fractional-first.json"
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli import \
            --input /artifacts/fractional-input.json > "$storage/fractional-repeat.json"
          jq -e '.created == false' "$storage/fractional-repeat.json"
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli export \
            --package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --release 2 \
            --output /artifacts/fractional-export
          jq -e '.published_at == "2026-10-09T12:00:00.100000Z"' \
            "$storage/fractional-export/manifest.json"
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli publish \
            --package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --release 2
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.offline_import \
            --database /artifacts/catalog.sqlite \
            --manifest /artifacts/fractional-export/manifest.json \
            --package /artifacts/fractional-export/base-pl.2.json.gz \
            --expected-package-id 47bdff67-e58b-5437-919b-ec00159afbc5 --expected-kind demo
          "${image[@]}" .venv/bin/python -c 'from calorie_app.modules.catalog.offline_import import OfflineCatalog; p=OfflineCatalog("/artifacts/catalog.sqlite", "47bdff67-e58b-5437-919b-ec00159afbc5", "demo").read_active_package(); assert p["release"] == 2; assert p["published_at"] == "2026-10-09T12:00:00.100000Z"'
          cmp "$storage/storage/demo/47bdff67-e58b-5437-919b-ec00159afbc5/base-pl.1.json.gz" \
            backend/data/demo/export/base-pl.1.json.gz
          "${image[@]}" .venv/bin/python -m calorie_app.modules.catalog.cli prune-page-tokens \
            > "$storage/cleanup.json"
          jq -e '.removed == 0 and .batch_limit == 1000' "$storage/cleanup.json"
          docker run -d --name e2-built-api --network host -v "$storage:/artifacts:ro" \
            -e DATABASE_URL=postgresql+psycopg://calorie_app_api:ci-api-only@127.0.0.1:5432/calorie_app \
            -e CATALOG_ARTIFACT_ROOT=/artifacts/storage \
            -e CATALOG_PAGE_TOKEN_SECRET=e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2 \
            calorie-backend:e2
          trap 'docker logs e2-built-api; docker rm -f e2-built-api' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 \
            -f http://127.0.0.1:8000/health/ready
          curl -fsS http://127.0.0.1:8000/api/v1/rations | jq -e '.items == [] and .next_page_token == null'
          test "$(curl -s -o "$storage/no-official.json" -w '%{http_code}' http://127.0.0.1:8000/api/v1/offline-package/manifest)" = 404
          jq -e '.code == "not_found" and .details == []' "$storage/no-official.json"
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install the project's Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check Android CI evidence handling
        run: python -m unittest discover -s tools/tests -p 'test_android_ci.py' -v
      - name: Build APK, run JVM tests and lint
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Require real JVM and lint results
        run: |
          python tools/android_ci.py check \
            --results android/app/build/test-results/testDebugUnitTest \
            --lint android/app/build/reports/lint-results-debug.xml \
            --output android/app/build/ci/jvm-summary.json
      - name: Package the built debug APK with its version and checksum
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          python tools/android_ci.py package \
            --directory android/app/build/outputs/apk/debug \
            --destination android/app/build/ci/apk \
            --commit "$TESTED_COMMIT" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Upload debug APK and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-${{ github.sha }}
          path: android/app/build/ci/apk/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload JVM and lint reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-jvm-lint-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
            android/app/build/ci/jvm-summary.json
          if-no-files-found: error
          retention-days: 14
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install the project's Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run every validation test on Android API 35 offline
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash ../tools/android_device_test.sh
      - name: Require real device test results without skips
        run: |
          python tools/android_ci.py check \
            --results android/app/build/outputs/androidTest-results/connected/validation \
            --output android/app/build/ci/device-summary.json
      - name: Upload device reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-api35-${{ github.sha }}
          path: |
            android/app/build/reports/androidTests/connected/validation/
            android/app/build/outputs/androidTest-results/connected/validation/
            android/app/build/ci/device-summary.json
            android/app/build/ci/offline-*.txt
          if-no-files-found: error
          retention-days: 14
  ci-required:
    if: always()
    needs: [contracts, quality, postgres, android-build, android-device]
    runs-on: ubuntu-latest
    steps:
      - name: Require actual successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
