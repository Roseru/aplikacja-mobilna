openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Wojskowy licznik kalorii — E0
  version: 0.1.0
  x-status: design draft
  description: Odczyty i statystyki E5 oraz synchronizacja E4 są wdrożone w backend/openapi.json. Funkcje E6–E9 pozostają opisane w planie prac; nie deklarujemy niewdrożonych operacji. Wdrożone health, katalog E2 i tożsamość/odczyty E3 opisuje backend/openapi.json
    generowane z FastAPI. Przykłady katalogu są wyłącznie demo.
servers:
- url: /api/v1
  description: Ścieżka względna; host HTTPS dostarcza O3.
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token RS256, zaufany issuer, aud calorie-api, role user/catalog_moderator/admin.
        Owner tylko z tokenu; max300s, skew60s.
