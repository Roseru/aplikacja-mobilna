      description: Pull→push→pull. Bez parametrów snapshot; kontynuacja snapshot_token+page_token+sync_epoch; incremental
        checkpoint+sync_epoch, opcjonalnie page_token. Te tryby wykluczają się. Pełne dane/strony nie nadpisują outbox. Tokeny
        są nieprzezroczyste, kolejność wynika z commit. Epoka ma pierwszeństwo przed wiekiem checkpointu.
      x-implementation-stage: E4
      security:
      - bearerAuth: []
      parameters:
      - name: checkpoint
        in: query
        required: false
