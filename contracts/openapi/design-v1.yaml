  /sync/push:
    post:
      operationId: push
      summary: Paczka≤100 operacji, JSON UTF-8≤1MiB, encja≤256KiB
      description: Paczka≤100 operacji, JSON UTF-8≤1MiB, encja≤256KiB. Auth→epoka→checkpoint→limity przed mutacją.200
        po dopuszczeniu, cztery wyniki per operacja, transakcja per operacja. Jedna zmiana encji/paczka; zmiana
        zależna w następnej paczce. operation_id zapewnia idempotencję zamiast nagłówka.
      x-implementation-stage: E4
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Poprawny wynik kontraktu; nie dowód działania serwera.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/PushResponse
              examples:
                example:
                  externalValue: ../examples/valid/sync-push-response.json
        '401':
          description: Nieważna sesja; brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-401.json
          headers:
            WWW-Authenticate:
              description: Wyzwanie bearer.
              schema:
                type: string
              example: Bearer
        '403':
          description: Brak roli; brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-403.json
        '409':
          description: Konflikt; dla błędu całego żądania brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error.json
        '413':
          description: Przekroczono limit bajtów.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-413.json
        '422':
          description: Niepoprawne dane/parametry.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-422.json
        '429':
          description: Limit żądań.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-429.json
          headers:
            Retry-After:
              description: Sekundy przed ponowieniem.
              schema:
                type: integer
                minimum: 1
              example: 30
        '503':
          description: Usługa czasowo niedostępna.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-503.json
          headers:
            Retry-After:
              description: Sekundy przed ponowieniem.
              schema:
                type: integer
                minimum: 1
              example: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/sync.schema.json#/$defs/PushRequest
            examples:
              example:
                externalValue: ../examples/valid/sync-push-request.json
  /sync/pull:
    get:
      operationId: pull
      summary: Pull→push→pull
      description: Pull→push→pull. Bez parametrów snapshot; kontynuacja snapshot_token+page_token+sync_epoch; incremental
        checkpoint+sync_epoch, opcjonalnie page_token. Te tryby wykluczają się. Pełne dane/strony nie nadpisują
        outbox. Tokeny są nieprzezroczyste, kolejność wynika z commit. Epoka ma pierwszeństwo przed wiekiem checkpointu.
      x-implementation-stage: E4
      security:
      - bearerAuth: []
      parameters:
      - name: checkpoint
        in: query
        required: false
        schema:
          $ref: ../schemas/sync.schema.json#/$defs/OpaqueToken
        example: opaque-checkpoint-example
        description: Ukończony checkpoint. Bez niego i bez tokenów stron rozpoczyna pełny snapshot.
      - name: sync_epoch
        in: query
        required: false
        schema:
          $ref: ../schemas/common.schema.json#/$defs/Uuid
        example: e1111111-1111-4111-8111-111111111111
        description: Wymagana dla checkpointu i kontynuacji; nieznana pierwszemu gościowi.
      - name: snapshot_token
        in: query
        required: false
        schema:
          $ref: ../schemas/sync.schema.json#/$defs/OpaqueToken
        example: opaque-snapshot-example
        description: Tylko kontynuacja snapshotu, razem z page_token i epoką; TTL60min.
      - name: page_token
        in: query
        required: false
        schema:
          $ref: ../schemas/sync.schema.json#/$defs/OpaqueToken
        example: opaque-page-example
        description: Kontynuacja snapshotu albo incremental; bez nowego checkpointu do ostatniej strony.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
        example: 500
        description: limit
      - name: recovery_operation_ids
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: ../schemas/common.schema.json#/$defs/Uuid
          maxItems: 100
          uniqueItems: true
        example:
        - a1111111-1111-4111-8111-111111111111
        description: 'Tylko początek snapshotu: odczyt zachowanych potwierdzeń. Parametr powtarzany.'
        style: form
        explode: true
      responses:
        '200':
          description: Poprawny wynik kontraktu; nie dowód działania serwera.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/PullResponse
              examples:
                example:
                  externalValue: ../examples/valid/sync-pull-response.json
        '401':
          description: Nieważna sesja; brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-401.json
          headers:
            WWW-Authenticate:
              description: Wyzwanie bearer.
              schema:
                type: string
              example: Bearer
        '403':
          description: Brak roli; brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-403.json
        '409':
          description: Konflikt; dla błędu całego żądania brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error.json
        '410':
          description: Wygasły token strony.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-expired.json
        '422':
          description: Niepoprawne dane/parametry.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-422.json
        '429':
          description: Limit żądań.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-429.json
          headers:
            Retry-After:
              description: Sekundy przed ponowieniem.
              schema:
                type: integer
                minimum: 1
              example: 30
        '503':
          description: Usługa czasowo niedostępna.
          content:
            application/json:
              schema:
                $ref: ../schemas/sync.schema.json#/$defs/SyncError
              examples:
                example:
                  externalValue: ../examples/valid/sync-error-503.json
          headers:
            Retry-After:
              description: Sekundy przed ponowieniem.
              schema:
                type: integer
                minimum: 1
              example: 30
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token RS256, zaufany issuer, aud calorie-api, role user/catalog_moderator/admin.
        Owner tylko z tokenu; max300s, skew60s.
