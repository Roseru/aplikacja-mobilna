openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Wojskowy licznik kalorii — E0
  version: 0.1.0
  x-status: design draft
  description: Projekt przyszłych operacji E4/E5. Wdrożone health, katalog E2 i tożsamość/odczyty E3 opisuje backend/openapi.json
    generowane z FastAPI. Przykłady katalogu są wyłącznie demo.
servers:
- url: /api/v1
  description: Ścieżka względna; host HTTPS dostarcza O3.
paths:
  /me/meals:
    get:
      operationId: read_meals
      summary: Własne żywe posiłki i snapshoty
      description: Własne żywe posiłki i snapshoty. Sortowanie occurred_at,entity_id; stabilny snapshot stron. Daty
        lokalne, usunięcia dostępne przez sync.
      x-implementation-stage: E5
      security:
      - bearerAuth: []
      parameters:
      - &id001
        name: from
        in: query
        required: true
        schema:
          $ref: ../schemas/common.schema.json#/$defs/Date
        example: '2026-10-01'
        description: Pierwsza data lokalna włącznie; zakres≤366dni.
      - &id002
        name: to
        in: query
        required: true
        schema:
          $ref: ../schemas/common.schema.json#/$defs/Date
        example: '2026-10-09'
        description: Ostatnia data lokalna włącznie; from≤to.
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        example: 100
        description: Liczba rekordów; porządek i snapshot opisuje kontrakt E0.
      - &id004
        name: page_token
        in: query
        required: false
        schema:
          $ref: ../schemas/common.schema.json#/$defs/Token
        example: opaque-page-example
        description: Nieprzezroczysty token strony, TTL60min; te same filtry.
      responses:
        '200':
          description: Poprawny wynik kontraktu; nie dowód działania serwera.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/MealPage
              examples:
                example:
                  externalValue: ../examples/valid/meal-page.json
        '401':
          description: Nieważna sesja; brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-401.json
          headers:
            WWW-Authenticate:
              description: Wyzwanie bearer.
              schema:
                type: string
              example: Bearer
        '403':
          description: Brak roli; brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-403.json
        '404':
          description: Brak zasobu lub cudzy zasób.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-404.json
        '409':
          description: Konflikt; dla błędu całego żądania brak mutacji.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-409.json
        '410':
          description: Wygasły token strony.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-410.json
        '422':
          description: Niepoprawne dane/parametry.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-422.json
        '429':
          description: Limit żądań.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-429.json
          headers:
            Retry-After:
              description: Sekundy przed ponowieniem.
              schema:
                type: integer
                minimum: 1
              example: 30
        '503':
          description: Usługa czasowo niedostępna.
          content:
            application/json:
              schema:
                $ref: ../schemas/domain.schema.json#/$defs/Error
              examples:
                example:
                  externalValue: ../examples/valid/error-503.json
          headers:
            Retry-After:
              description: Sekundy przed ponowieniem.
              schema:
                type: integer
                minimum: 1
              example: 30
  /me/weights:
    get:
      operationId: read_weights
      summary: Własne pomiary bez interpolacji braków
      description: Własne pomiary bez interpolacji braków. Sortowanie occurred_at,entity_id; daty lokalne i stabilny
        snapshot stron.
      x-implementation-stage: E5
      security:
