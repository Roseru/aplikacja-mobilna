  /me/diary-days:
    get:
      operationId: read_diary_days
      summary: Własne deklaracje kompletności dnia
      description: Własne deklaracje kompletności dnia. Efektywna kompletność jest wyliczana z posiłków, nie przyjmowana
        z flagi. Sortowanie UUID; stabilne strony.
      x-implementation-stage: E5
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - *id002
      - *id003
