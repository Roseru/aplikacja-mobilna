name: calorie-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local admin password}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?Set migrator password}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?Set API password}
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD:?Set worker password}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set Keycloak password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-calorie.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
