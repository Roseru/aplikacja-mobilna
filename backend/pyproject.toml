[project]
name = "calorie-backend"
version = "0.1.0"
description = "Backend wojskowego licznika kalorii"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL 17 (TEST_DATABASE_URL)"]

[tool.hatch.build.targets.wheel]
packages = ["src/calorie_app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
